<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Portfolio Web-App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz@9..144&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:,">
  <style>
    .login-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--spacing-lg);
      position: relative;
      z-index: 1;
    }

    .login-card {
      background-color: var(--color-bg);
      border: var(--border-thin) solid var(--color-border);
      padding: var(--spacing-3xl);
      max-width: 600px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }

    .login-card h1 {
      font-size: var(--text-4xl);
      margin-bottom: var(--spacing-lg);
      font-weight: 700;
    }

    .login-card p {
      font-size: var(--text-base);
      color: var(--color-text-light);
      margin-bottom: var(--spacing-2xl);
    }

    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    .form-group label {
      display: block;
      font-size: var(--text-sm);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--spacing-sm);
      color: var(--color-text);
    }

    .form-group input[type="email"],
    .form-group input[type="password"] {
      width: 100%;
      padding: var(--spacing-md);
      border: var(--border-medium) solid var(--color-border);
      background-color: var(--color-bg);
      font-family: inherit;
      font-size: var(--text-base);
      transition: all 0.2s;
    }

    .form-group input[type="email"]:focus,
    .form-group input[type="password"]:focus {
      outline: none;
      border: var(--border-thick) solid var(--color-border);
      box-shadow: var(--shadow-md);
    }

    .btn-submit {
      width: 100%;
      padding: var(--spacing-md);
      background-color: var(--color-text);
      color: var(--color-bg);
      border: var(--border-thin) solid var(--color-border);
      font-family: inherit;
      font-size: var(--text-base);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: var(--spacing-lg);
    }

    .btn-submit:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-md);
    }

    .btn-submit:active {
      transform: translate(0, 0);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background-color: var(--color-slab-yellow);
      border: var(--border-medium) solid var(--color-border);
      color: var(--color-text);
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
      font-size: var(--text-sm);
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    .error-message.success {
      background-color: var(--color-slab-mint);
    }

    .reset-link {
      text-align: center;
      margin-top: var(--spacing-lg);
    }

    .reset-link a {
      color: var(--color-accent);
      border-bottom: 1px solid var(--color-accent);
      font-size: var(--text-sm);
      transition: opacity 0.2s;
    }

    .reset-link a:hover {
      opacity: 0.7;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: var(--spacing-2xl) 0;
      gap: var(--spacing-md);
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: var(--color-border);
    }

    .divider span {
      font-size: var(--text-xs);
      color: var(--color-text-light);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-google {
      width: 100%;
      padding: var(--spacing-md);
      background-color: white;
      color: var(--color-text);
      border: var(--border-medium) solid var(--color-border);
      font-family: inherit;
      font-size: var(--text-base);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-md);
    }

    .btn-google:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-md);
      background-color: #f9f9f9;
    }

    .btn-google:active {
      transform: translate(0, 0);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    .btn-google:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-bg);
      border-radius: 50%;
      border-top-color: transparent;
      animation: spinner 0.6s linear infinite;
    }

    @keyframes spinner {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="login-page">
  <div class="login-page">
    <div class="login-card">
      <h1>Log In</h1>
      <p>Enter your credentials to access your portfolio editor.</p>

      <div class="error-message" id="error-message"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn-submit" id="login-btn">
          <span id="btn-text">Log In</span>
        </button>
      </form>

      <div class="divider">
        <span>Or</span>
      </div>

      <button type="button" class="btn-google" id="google-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="reset-link">
        <a href="#" id="reset-link">Forgot password?</a>
      </div>

      <div style="text-align: center; margin-top: var(--spacing-lg); font-size: var(--text-sm);">
        Don't have an account? <a href="signup.html" style="color: var(--color-accent); border-bottom: 1px solid var(--color-accent);">Create one</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { 
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      signInWithPopup,
      GoogleAuthProvider,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js';
    import { doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js';

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const errorMessage = document.getElementById('error-message');
    const resetLink = document.getElementById('reset-link');

    // Check if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'editor.html';
      }
    });

    // Handle login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Disable form
      loginBtn.disabled = true;
      btnText.innerHTML = '<span class="loading"></span>';
      errorMessage.classList.remove('visible');

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Redirect happens via onAuthStateChanged
      } catch (error) {
        console.error('Login error:', error);
        
        let message = 'Login failed. Please check your credentials.';
        
        if (error.code === 'auth/invalid-credential') {
          message = 'Invalid email or password.';
        } else if (error.code === 'auth/user-not-found') {
          message = 'No account found with this email.';
        } else if (error.code === 'auth/wrong-password') {
          message = 'Incorrect password.';
        } else if (error.code === 'auth/too-many-requests') {
          message = 'Too many failed attempts. Try again later.';
        } else if (error.code === 'auth/network-request-failed') {
          message = 'Network error. Check your connection.';
        }

        errorMessage.textContent = message;
        errorMessage.classList.add('visible');

        // Re-enable form
        loginBtn.disabled = false;
        btnText.textContent = 'Log In';
      }
    });

    // Handle Google Sign-In
    const googleBtn = document.getElementById('google-btn');
    googleBtn.addEventListener('click', async () => {
      googleBtn.disabled = true;
      const originalText = googleBtn.innerHTML;
      googleBtn.innerHTML = '<span class="loading"></span> Signing in...';
      errorMessage.classList.remove('visible');

      try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        // Check if user profile exists in Firestore
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (!userDoc.exists()) {
          // First time Google login - create profile and redirect to profile editor
          await setDoc(doc(db, 'users', user.uid), {
            displayName: user.displayName || user.email.split('@')[0],
            email: user.email,
            username: '',
            bio: '',
            avatarUrl: user.photoURL || '',
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
          window.location.href = 'profile.html';
        } else {
          // Returning user - go to editor
          window.location.href = 'editor.html';
        }
      } catch (error) {
        console.error('Google sign-in error:', error);
        
        let message = 'Sign in with Google failed.';
        if (error.code === 'auth/popup-closed-by-user') {
          message = 'Sign-in popup was closed.';
        } else if (error.code === 'auth/network-request-failed') {
          message = 'Network error. Check your connection.';
        }
        
        errorMessage.textContent = message;
        errorMessage.classList.add('visible');
        
        googleBtn.disabled = false;
        googleBtn.innerHTML = originalText;
      }
    });

    // Handle password reset
    resetLink.addEventListener('click', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      
      if (!email) {
        errorMessage.textContent = 'Enter your email address first.';
        errorMessage.classList.add('visible');
        emailInput.focus();
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        errorMessage.textContent = 'Password reset email sent! Check your inbox.';
        errorMessage.style.background = '#efe';
        errorMessage.style.borderColor = '#cfc';
        errorMessage.style.color = '#363';
        errorMessage.classList.add('visible');
      } catch (error) {
        console.error('Reset error:', error);
        errorMessage.textContent = 'Could not send reset email. Check the email address.';
        errorMessage.classList.add('visible');
      }
    });
  </script>
  </div>
</body>
</html>
