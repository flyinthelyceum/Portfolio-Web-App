<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Admin for Art & Technology Portfolio"
  />
  <title>Content Manager - Portfolio</title>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
  <script>
    // Initialize Decap CMS with GitHub backend (PKCE OAuth)
    if (window.CMS) {
      CMS.registerBackend('github', window.DecapCmsBackendGithub);
      
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'flyinthelyceum/Portfolio-Web-App',
            branch: 'main',
            auth_type: 'pkce',
            app_id: 'Ov23li020gRLyf588iGF'
          },
          site_url: 'https://flyinthelyceum.github.io/Portfolio-Web-App/',
          display_url: 'https://flyinthelyceum.github.io/Portfolio-Web-App/',
          media_folder: 'assets/uploads',
          public_folder: '/assets/uploads',
          collections: [
            {
              name: 'posts',
              label: 'Posts',
              folder: 'posts',
              create: true,
              slug: '{{slug}}',
              editor: { preview: false },
              fields: [
                { label: 'Title', name: 'title', widget: 'string' },
                { label: 'Publish Date', name: 'date', widget: 'datetime' },
                { label: 'Type', name: 'type', widget: 'select', options: ['log', 'project'] },
                { label: 'Tags', name: 'tags', widget: 'list' },
                { label: 'Summary', name: 'summary', widget: 'string', required: false },
                { label: 'Featured Image', name: 'featured_image', widget: 'image', required: false },
                { label: 'Gallery Images', name: 'gallery_images', widget: 'list', field: { label: 'Image', name: 'image', widget: 'image' }, required: false },
                { label: 'Project Number (1-4)', name: 'project', widget: 'list', field: { label: 'Project', name: 'num', widget: 'number' }, required: false },
                { label: 'Body', name: 'body', widget: 'markdown' }
              ]
            },
            {
              name: 'projects',
              label: 'Projects',
              folder: 'projects',
              create: true,
              slug: '{{slug}}',
              editor: { preview: false },
              fields: [
                { label: 'Title', name: 'title', widget: 'string' },
                { label: 'Order', name: 'order', widget: 'number' },
                { label: 'Summary', name: 'summary', widget: 'string' },
                { label: 'Hero Image', name: 'hero_image', widget: 'image', required: false },
                { label: 'Body', name: 'body', widget: 'markdown' }
              ]
            },
            {
              name: 'settings',
              label: 'Settings',
              files: [
                {
                  label: 'Site Settings',
                  name: 'settings',
                  file: 'settings.json',
                  fields: [
                    { label: 'Student Name', name: 'studentName', widget: 'string' },
                    { label: 'Site Title', name: 'siteTitle', widget: 'string' },
                    { label: 'Bio', name: 'bio', widget: 'text' },
                    { label: 'Accent Color', name: 'accentColor', widget: 'string' },
                    { label: 'Font Pairing', name: 'fontPairing', widget: 'string' },
                    { label: 'Card Radius', name: 'cardRadius', widget: 'string' },
                    { label: 'Spacing', name: 'spacing', widget: 'select', options: ['comfortable', 'tight', 'generous'] },
                    { label: 'GitHub Repo (owner/name)', name: 'githubRepo', widget: 'string' },
                    {
                      label: 'Links',
                      name: 'links',
                      widget: 'object',
                      fields: [
                        { label: 'Instagram', name: 'Instagram', widget: 'string', required: false },
                        { label: 'GitHub', name: 'GitHub', widget: 'string', required: false },
                        { label: 'Email', name: 'Email', widget: 'string', required: false }
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      });
    } else {
      console.error('Decap CMS failed to load');
    }
  </script>
</body>
</html>
