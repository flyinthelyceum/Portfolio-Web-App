<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Barcode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz@9..144&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <link rel="icon" href="data:,">
  <style>
    .attendance-header {
      background-color: var(--color-bg);
      border-bottom: var(--border-medium) solid var(--color-border);
      padding: var(--spacing-lg) var(--spacing-2xl);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .attendance-header__left {
      display: flex;
      align-items: baseline;
      gap: var(--spacing-lg);
    }

    .attendance-header__title {
      font-size: var(--text-2xl);
      font-weight: 700;
      margin: 0;
    }

    .attendance-header__user {
      font-size: var(--text-sm);
      color: var(--color-text-light);
      font-style: italic;
    }

    .attendance-header__right {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .attendance-btn {
      padding: var(--spacing-sm) var(--spacing-md);
      border: var(--border-thin) solid var(--color-border);
      background-color: var(--color-bg);
      font-family: inherit;
      font-size: var(--text-sm);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .attendance-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-sm);
    }

    .attendance-btn:active {
      transform: translate(0, 0);
    }

    .attendance-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-2xl);
      background-color: var(--color-bg);
    }

    .attendance-card {
      width: 100%;
      max-width: 500px;
      background: white;
      border: var(--border-thin) solid var(--color-border);
      padding: var(--spacing-2xl);
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .attendance-card__title {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      margin: 0 0 var(--spacing-sm) 0;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    .attendance-card__name {
      font-size: var(--text-lg);
      color: var(--color-text);
      margin: 0 0 var(--spacing-md) 0;
    }

    .attendance-card__id {
      font-size: var(--text-sm);
      color: var(--color-text-light);
      margin: 0 0 var(--spacing-lg) 0;
      font-family: var(--font-mono);
    }

    .attendance-barcode-container {
      background: white;
      padding: var(--spacing-lg);
      border: var(--border-thin) solid var(--color-border);
      margin: var(--spacing-lg) 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }

    .attendance-barcode-empty {
      color: var(--color-text-light);
      font-size: var(--text-sm);
    }

    .attendance-actions {
      display: flex;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-lg);
      justify-content: center;
    }

    .attendance-print-btn {
      padding: var(--spacing-sm) var(--spacing-lg);
      border: var(--border-medium) solid var(--color-text);
      background: var(--color-bg);
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .attendance-print-btn:hover {
      background: var(--color-text);
      color: white;
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-md);
    }

    .attendance-error {
      background: #fee;
      border: var(--border-thin) solid #c00;
      color: #c00;
      padding: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
      text-align: center;
      font-size: var(--text-sm);
    }

    @media print {
      .attendance-header,
      .attendance-actions,
      .attendance-btn {
        display: none;
      }

      .attendance-container {
        min-height: auto;
        padding: 0;
        background: white;
      }

      .attendance-card {
        box-shadow: none;
        border: none;
      }
    }
  </style>
</head>
<body>
  <header class="attendance-header">
    <div class="attendance-header__left">
      <h1 class="attendance-header__title">Attendance Barcode</h1>
      <span class="attendance-header__user" id="user-name">Loading…</span>
    </div>
    <div class="attendance-header__right">
      <button class="attendance-btn" id="back-btn">Back to Editor</button>
    </div>
  </header>

  <div class="attendance-container">
    <div class="attendance-card">
      <h2 class="attendance-card__title">Your Attendance Code</h2>
      <p class="attendance-card__name" id="display-name">Loading…</p>
      <p class="attendance-card__id">Student ID: <span id="student-id">—</span></p>

      <div id="error-message" class="attendance-error" style="display: none;"></div>

      <div class="attendance-barcode-container">
        <svg id="barcode"></svg>
        <div class="attendance-barcode-empty" id="barcode-empty" style="display: none;">
          No student ID set. Update your profile first.
        </div>
      </div>

      <div class="attendance-actions">
        <button class="attendance-print-btn" id="print-btn">Print Barcode</button>
      </div>
    </div>
  </div>

  <script type="module" src="attendance.js"></script>
</body>
</html>
