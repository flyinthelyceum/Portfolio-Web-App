<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Barcode — Portfolio Web-App</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="nav">
    <div class="nav__left">
      <h1 class="nav__title">Attendance Barcode</h1>
      <span class="nav__user" id="user-name">Loading…</span>
    </div>
    <div class="nav__right">
      <button class="btn" id="back-btn">Back to Editor</button>
    </div>
  </header>

  <div class="center-page">
    <div class="center-card barcode-card">
      <h1 class="barcode-card__title">Your Attendance Code</h1>
      <p class="barcode-card__name" id="display-name">Loading…</p>
      <p class="barcode-card__id">Student ID: <span id="student-id">—</span></p>

      <div id="error-message" class="alert alert--error"></div>

      <div class="barcode-container">
        <svg id="barcode"></svg>
        <div class="barcode-empty" id="barcode-empty" style="display: none;">
          No student ID set. Update your profile first.
        </div>
      </div>

      <div class="actions" style="justify-content: center;">
        <button class="btn" id="print-btn">Print Barcode</button>
      </div>
    </div>
  </div>

  <script type="module" src="attendance.js"></script>
</body>
</html>
