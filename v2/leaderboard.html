<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Studio Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ============================================
       Leaderboard Page - Tom Sachs ISRU Style
       Studio Color Doctrine: #EEF1E6, #030506, #565B21
       ============================================ */

    body.leaderboard-page {
      background-color: #EEF1E6;
    }

    body.leaderboard-page::before {
      display: none;
    }

    /* Override base styles */
    body.leaderboard-page .main-content {
      max-width: none;
      padding: 0;
      margin: 0;
    }

    body.leaderboard-page .nav-bar {
      background: #EEF1E6;
    }

    body.leaderboard-page .nav-container {
      max-width: none;
      padding: 0 24px;
    }

    /* ============================================
       Page Layout
       ============================================ */
    .leaderboard-layout {
      padding: 16px 24px;
      min-height: calc(100vh - 80px);
      box-sizing: border-box;
      max-width: 800px;
    }

    /* Page Header */
    .page-header {
      margin-bottom: 20px;
    }

    .page-title-label {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 12px;
      background: #030506;
      color: #FFFFFF;
      margin-bottom: 8px;
    }

    /* ============================================
       Filter Tabs - Stamp style
       ============================================ */
    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filter-btn {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 12px;
      border: 2px solid #030506;
      background: #FFFFFF;
      color: #030506;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .filter-btn:hover {
      background: #EEF1E6;
    }

    .filter-btn.active {
      background: #030506;
      color: #FFFFFF;
    }

    /* ============================================
       Leaderboard Panel - FrameC
       ============================================ */
    .leaderboard-panel {
      background: #FFFFFF;
      border: 4px solid #030506;
      position: relative;
      margin-top: 16px;
    }

    .leaderboard-panel::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      border: 1px solid #030506;
      pointer-events: none;
    }

    .leaderboard-panel-body {
      padding: 12px;
      position: relative;
    }

    /* Panel Label */
    .leaderboard-panel-label {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      background: #030506;
      color: #FFFFFF;
      position: relative;
      transform: translate(-6px, -6px);
      margin-bottom: 8px;
    }

    .leaderboard-panel-label::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: calc(100% + 16px);
      height: 1px;
      background: #030506;
    }

    /* ============================================
       Leaderboard Rows
       ============================================ */
    .leaderboard-rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .leaderboard-row-v2 {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border: 2px solid #030506;
      background: #FFFFFF;
      gap: 12px;
    }

    .leaderboard-row-v2.current-user {
      background: #565B21;
      color: #FFFFFF;
    }

    .leaderboard-row-v2.current-user .leaderboard-rank {
      background: #FFFFFF;
      color: #565B21;
    }

    .leaderboard-row-v2.current-user .leaderboard-score {
      background: #FFFFFF;
      color: #030506;
    }

    /* Podium rows (1st, 2nd, 3rd) */
    .leaderboard-row-v2.rank-1 {
      border-width: 3px;
    }

    .leaderboard-row-v2.rank-1 .leaderboard-rank {
      background: #030506;
      color: #FFFFFF;
      font-size: 14px;
    }

    .leaderboard-row-v2.rank-2 .leaderboard-rank,
    .leaderboard-row-v2.rank-3 .leaderboard-rank {
      background: #565B21;
      color: #FFFFFF;
    }

    .leaderboard-rank {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #EEF1E6;
      flex-shrink: 0;
    }

    .leaderboard-name {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leaderboard-score {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      background: #030506;
      color: #FFFFFF;
      flex-shrink: 0;
    }

    /* Micro-interactions */
    .leaderboard-row-v2 {
      transition: all 0.1s ease;
    }

    .leaderboard-row-v2:hover:not(.current-user) {
      background: #EEF1E6;
    }

    .filter-btn {
      transition: all 0.1s ease;
    }

    .filter-btn:active {
      transform: scale(0.95);
    }

    .leaderboard-panel {
      transition: box-shadow 0.15s ease;
    }

    .leaderboard-panel:hover {
      box-shadow: 4px 4px 0 rgba(3, 5, 6, 0.1);
    }

    .leaderboard-panel:hover .leaderboard-panel-label {
      background: #565B21;
    }

    /* ============================================
       Empty State
       ============================================ */
    .empty-plate {
      background: #FFFFFF;
      border: 3px solid #030506;
      padding: 32px 24px;
      text-align: center;
      max-width: 400px;
      margin: 40px auto;
    }

    .empty-plate-text {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #030506;
      opacity: 0.6;
    }

    /* Buttons */
    .btn {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 8px 16px;
      border: 3px solid #030506;
      border-radius: 0;
      display: inline-block;
      text-decoration: none;
    }

    .btn-primary {
      background: #030506;
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: #565B21;
      border-color: #565B21;
    }

    /* ============================================
       Responsive
       ============================================ */
    @media (min-width: 900px) {
      .leaderboard-layout {
        padding: 20px 32px;
      }
    }

    @media (min-width: 1600px) {
      .leaderboard-layout {
        padding: 24px 48px;
      }
    }

    @media (max-width: 600px) {
      .leaderboard-layout {
        padding: 12px 16px;
      }

      .filter-btn {
        font-size: 8px;
        padding: 5px 8px;
      }

      .leaderboard-name {
        font-size: 13px;
      }
    }
  </style>
</head>
<body class="leaderboard-page">
  <div class="app-shell">
    <!-- Navigation -->
    <nav class="nav-bar">
      <div class="nav-container">
        <a href="index.html" class="nav-brand">Studio Log</a>
        <div class="nav-tabs">
          <a href="index.html" class="nav-tab">Home</a>
          <a href="tasks.html" class="nav-tab">Tasks</a>
          <a href="highlights.html" class="nav-tab">Highlights</a>
          <a href="leaderboard.html" class="nav-tab active">Leaderboard</a>
        </div>
        <button class="nav-gear" id="gear-btn" title="Settings" onclick="navigateToSettings()"></button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Loading State -->
      <div id="loading" class="loading">
        <div class="loading-spinner"></div>
      </div>

      <!-- Auth Required State -->
      <div id="auth-required" class="empty-plate" style="display: none;">
        <div class="empty-plate-text">Log in to view Leaderboard</div>
        <a href="login.html" class="btn btn-primary" style="margin-top: 16px;">Log In</a>
      </div>

      <!-- Leaderboard Content -->
      <div id="leaderboard-content" class="leaderboard-layout" style="display: none;">
        <div class="page-header">
          <div class="page-title-label">Leaderboard</div>
        </div>

        <!-- Main Filters -->
        <div class="filter-row" id="main-filters">
          <button class="filter-btn active" data-board="total_alltime">Total</button>
          <button class="filter-btn" data-board="total_week">This Week</button>
          <button class="filter-btn" data-board="social_alltime">Social</button>
          <button class="filter-btn" data-board="feature_alltime">Featured</button>
        </div>

        <!-- Category Filters (dynamic) -->
        <div class="filter-row" id="category-filters">
          <!-- Category buttons will be added here -->
        </div>

        <!-- Leaderboard Panel -->
        <div class="leaderboard-panel">
          <div class="leaderboard-panel-body">
            <span class="leaderboard-panel-label" id="board-label">Rankings</span>

            <!-- Leaderboard List -->
            <div id="leaderboard-list" class="leaderboard-rows">
              <!-- Rows will be populated here -->
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div id="no-entries" class="empty-plate" style="display: none;">
          <div class="empty-plate-text">No results yet</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Global handler for gear button -->
  <script>
    window.navigateToSettings = function() {
      window.location.href = 'settings.html';
    };
  </script>

  <script type="module">
    import { initAuth, getCurrentUser } from './js/auth.js';
    import { db, collection, doc, getDoc, getDocs, query, where, orderBy, limit } from './js/firebase-config.js';
    import { insertIcon } from './js/icon.js';

    // Insert settings icon
    const gearBtn = document.getElementById('gear-btn');
    if (gearBtn) {
      insertIcon(gearBtn, 'settings', 24);
      gearBtn.style.cursor = 'pointer';
    }

    // State
    let currentUser = null;
    let categories = [];
    let currentBoard = 'total_alltime';

    // DOM Elements
    const loading = document.getElementById('loading');
    const authRequired = document.getElementById('auth-required');
    const leaderboardContent = document.getElementById('leaderboard-content');
    const leaderboardList = document.getElementById('leaderboard-list');
    const noEntries = document.getElementById('no-entries');
    const categoryFilters = document.getElementById('category-filters');

    // Get current week key
    function getWeekKey() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
      const week1 = new Date(d.getFullYear(), 0, 4);
      const weekNum = 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
      return `${d.getFullYear()}-W${String(weekNum).padStart(2, '0')}`;
    }

    // Initialize auth
    initAuth(async (user, userData) => {
      currentUser = user;
      loading.style.display = 'none';

      if (!user) {
        authRequired.style.display = 'block';
        leaderboardContent.style.display = 'none';
        return;
      }

      authRequired.style.display = 'none';
      leaderboardContent.style.display = 'block';

      await loadCategories();
      renderCategoryFilters();
      await loadLeaderboard(currentBoard);
    });

    // Load categories
    async function loadCategories() {
      try {
        const categoriesRef = collection(db, 'taskCategories');
        const q = query(categoriesRef, orderBy('sortOrder', 'asc'));
        const snapshot = await getDocs(q);

        categories = [];
        snapshot.forEach(doc => {
          categories.push({ id: doc.id, ...doc.data() });
        });
      } catch (error) {
        console.error('Error loading categories:', error);
      }
    }

    // Render category filter buttons
    function renderCategoryFilters() {
      categoryFilters.innerHTML = categories.map(cat =>
        `<button class="filter-btn" data-board="category_${cat.id}_alltime">${cat.name}</button>`
      ).join('');

      // Add click handlers
      categoryFilters.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => selectBoard(btn.dataset.board));
      });
    }

    // Load leaderboard data
    async function loadLeaderboard(boardId) {
      currentBoard = boardId;

      // Handle week board specially
      let actualBoardId = boardId;
      if (boardId === 'total_week') {
        actualBoardId = `total_week_${getWeekKey()}`;
      }

      try {
        // Try to get from scoreboards
        const entriesRef = collection(db, 'scoreboards', actualBoardId, 'entries');
        const q = query(entriesRef, orderBy('score', 'desc'), limit(50));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          // Fall back to direct user query for total_alltime
          if (boardId === 'total_alltime') {
            await loadFromUsers();
            return;
          }
          leaderboardList.style.display = 'none';
          noEntries.style.display = 'block';
          return;
        }

        const entries = [];
        snapshot.forEach(doc => {
          entries.push({ id: doc.id, ...doc.data() });
        });

        // Get user names
        const userIds = entries.map(e => e.userId);
        const userNames = {};

        for (const userId of userIds) {
          const userDoc = await getDoc(doc(db, 'users', userId));
          if (userDoc.exists()) {
            userNames[userId] = userDoc.data().fullName || 'Student';
          }
        }

        renderLeaderboard(entries, userNames);
      } catch (error) {
        console.error('Error loading leaderboard:', error);
        // Try fallback
        if (boardId === 'total_alltime') {
          await loadFromUsers();
        }
      }
    }

    // Fallback: load directly from users collection
    async function loadFromUsers() {
      try {
        const usersRef = collection(db, 'users');
        const q = query(usersRef, orderBy('pointsTotal', 'desc'), limit(50));
        const snapshot = await getDocs(q);

        if (snapshot.empty) {
          leaderboardList.style.display = 'none';
          noEntries.style.display = 'block';
          return;
        }

        const entries = [];
        const userNames = {};

        snapshot.forEach(doc => {
          const data = doc.data();
          entries.push({
            userId: doc.id,
            score: data.pointsTotal || 0
          });
          userNames[doc.id] = data.fullName || 'Student';
        });

        renderLeaderboard(entries, userNames);
      } catch (error) {
        console.error('Error loading from users:', error);
      }
    }

    // Render leaderboard
    function renderLeaderboard(entries, userNames) {
      if (entries.length === 0) {
        leaderboardList.style.display = 'none';
        noEntries.style.display = 'block';
        document.querySelector('.leaderboard-panel').style.display = 'none';
        return;
      }

      leaderboardList.style.display = 'flex';
      noEntries.style.display = 'none';
      document.querySelector('.leaderboard-panel').style.display = 'block';

      leaderboardList.innerHTML = entries.map((entry, index) => {
        const isCurrentUser = entry.userId === currentUser?.uid;
        const rank = index + 1;
        let rankClass = '';
        if (rank === 1) rankClass = 'rank-1';
        else if (rank === 2) rankClass = 'rank-2';
        else if (rank === 3) rankClass = 'rank-3';

        return `
          <div class="leaderboard-row-v2 ${isCurrentUser ? 'current-user' : ''} ${rankClass}">
            <span class="leaderboard-rank">${rank}</span>
            <span class="leaderboard-name">${userNames[entry.userId] || 'Student'}</span>
            <span class="leaderboard-score">${(entry.score || 0).toLocaleString()}</span>
          </div>
        `;
      }).join('');
    }

    // Select board
    function selectBoard(boardId) {
      // Update active state
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.board === boardId);
      });

      // Update board label
      const boardLabels = {
        'total_alltime': 'Total Points',
        'total_week': 'This Week',
        'social_alltime': 'Social Points',
        'feature_alltime': 'Featured Points'
      };
      const labelEl = document.getElementById('board-label');
      labelEl.textContent = boardLabels[boardId] || 'Rankings';

      loadLeaderboard(boardId);
    }

    // Add click handlers to main filters
    document.querySelectorAll('#main-filters .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => selectBoard(btn.dataset.board));
    });
  </script>
</body>
</html>
