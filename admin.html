<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Dashboard — Portfolio Web-App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz@9..144&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:,">
  <style>
    .admin-header {
      background-color: var(--color-bg);
      border-bottom: var(--border-medium) solid var(--color-border);
      padding: var(--spacing-lg) var(--spacing-2xl);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-header__left {
      display: flex;
      align-items: baseline;
      gap: var(--spacing-lg);
    }

    .admin-header__title {
      font-size: var(--text-2xl);
      font-weight: 700;
      margin: 0;
    }

    .admin-header__user {
      font-size: var(--text-sm);
      color: var(--color-text-light);
      font-style: italic;
    }

    .admin-header__right {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }

    .admin-btn {
      padding: var(--spacing-sm) var(--spacing-md);
      border: var(--border-thin) solid var(--color-border);
      background-color: var(--color-bg);
      font-family: inherit;
      font-size: var(--text-sm);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: var(--shadow-sm);
    }

    .admin-btn:active {
      transform: translate(0, 0);
    }

    .admin-btn--primary {
      background-color: var(--color-text);
      color: var(--color-bg);
      border-color: var(--color-text);
    }

    .admin-btn--primary:hover {
      box-shadow: var(--shadow-md);
    }

    .admin-main {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--spacing-2xl);
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-2xl);
    }

    .admin-card {
      border: var(--border-thin) solid var(--color-border);
      background: var(--color-bg);
      padding: var(--spacing-lg);
      box-shadow: var(--shadow-sm);
    }

    .admin-card__label {
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-text-light);
      margin-bottom: var(--spacing-sm);
    }

    .admin-card__value {
      font-size: var(--text-2xl);
      font-weight: 700;
    }

    .admin-section {
      margin-bottom: var(--spacing-2xl);
    }

    .admin-section__title {
      font-size: var(--text-lg);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: var(--spacing-md);
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      border: var(--border-thin) solid var(--color-border);
    }

    .admin-table th,
    .admin-table td {
      text-align: left;
      padding: var(--spacing-sm) var(--spacing-md);
      border-bottom: var(--border-thin) solid var(--color-border);
      font-size: var(--text-sm);
    }

    .admin-table th {
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-light);
      background: #f8f8f8;
    }

    .admin-table tr:hover td {
      background: #fdfdfd;
    }

    .admin-pill {
      display: inline-block;
      padding: 2px 8px;
      border: var(--border-thin) solid var(--color-border);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .admin-actions {
      display: flex;
      gap: var(--spacing-md);
      flex-wrap: wrap;
    }

    .admin-empty {
      border: var(--border-thin) dashed var(--color-border);
      padding: var(--spacing-lg);
      color: var(--color-text-light);
      font-size: var(--text-sm);
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-header__left">
      <h1 class="admin-header__title">Instructor Dashboard</h1>
      <span class="admin-header__user" id="admin-user">Loading…</span>
    </div>
    <div class="admin-header__right">
      <button class="admin-btn" id="view-site-btn">View Site</button>
      <button class="admin-btn" id="editor-btn">Editor</button>
      <button class="admin-btn" id="logout-btn">Log Out</button>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-grid" id="stats-grid">
      <div class="admin-card">
        <div class="admin-card__label">Students</div>
        <div class="admin-card__value" id="stat-students">0</div>
      </div>
      <div class="admin-card">
        <div class="admin-card__label">Total Posts</div>
        <div class="admin-card__value" id="stat-posts">0</div>
      </div>
      <div class="admin-card">
        <div class="admin-card__label">Logs</div>
        <div class="admin-card__value" id="stat-logs">0</div>
      </div>
      <div class="admin-card">
        <div class="admin-card__label">Projects</div>
        <div class="admin-card__value" id="stat-projects">0</div>
      </div>
      <div class="admin-card">
        <div class="admin-card__label">Last 7 Days</div>
        <div class="admin-card__value" id="stat-last7">0</div>
      </div>
    </section>

    <section class="admin-section">
      <div class="admin-section__title">Quick Actions</div>
      <div class="admin-actions">
        <button class="admin-btn" id="export-csv-students-btn">Download Students CSV</button>
        <button class="admin-btn" id="export-csv-posts-btn">Download Posts CSV</button>
        <button class="admin-btn" id="export-json-btn">Download JSON Export</button>
        <button class="admin-btn" id="refresh-btn">Refresh Data</button>
      </div>
    </section>

    <section class="admin-section">
      <div class="admin-section__title">Students</div>
      <div id="students-container">
        <div class="admin-empty">Loading students…</div>
      </div>
    </section>

    <section class="admin-section">
      <div class="admin-section__title">Recent Activity</div>
      <div id="activity-container">
        <div class="admin-empty">Loading activity…</div>
      </div>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
