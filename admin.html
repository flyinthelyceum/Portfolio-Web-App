<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor Dashboard — Portfolio Web-App</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="nav">
    <div class="nav__left">
      <h1 class="nav__title">Instructor Dashboard</h1>
      <span class="nav__user" id="admin-user">Loading…</span>
    </div>
    <div class="nav__right">
      <button class="btn" id="moderation-btn">Moderation</button>
      <button class="btn" id="view-site-btn">View Site</button>
      <button class="btn" id="editor-btn">Editor</button>
      <button class="btn" id="logout-btn">Log Out</button>
    </div>
  </header>

  <main class="page">
    <section class="stats" id="stats-grid">
      <div class="stat">
        <div class="stat__label">Students</div>
        <div class="stat__value" id="stat-students">0</div>
      </div>
      <div class="stat">
        <div class="stat__label">Total Posts</div>
        <div class="stat__value" id="stat-posts">0</div>
      </div>
      <div class="stat">
        <div class="stat__label">Logs</div>
        <div class="stat__value" id="stat-logs">0</div>
      </div>
      <div class="stat">
        <div class="stat__label">Projects</div>
        <div class="stat__value" id="stat-projects">0</div>
      </div>
      <div class="stat">
        <div class="stat__label">Last 7 Days</div>
        <div class="stat__value" id="stat-last7">0</div>
      </div>
    </section>

    <section class="section">
      <div class="section__title">Quick Actions</div>
      <div class="actions">
        <button class="btn" id="export-csv-students-btn">Download Students CSV</button>
        <button class="btn" id="export-csv-posts-btn">Download Posts CSV</button>
        <button class="btn" id="export-json-btn">Download JSON Export</button>
        <button class="btn" id="refresh-btn">Refresh Data</button>
      </div>
    </section>

    <section class="section">
      <div class="section__title">Students</div>
      <div id="students-container">
        <div class="empty">Loading students…</div>
      </div>
    </section>

    <section class="section">
      <div class="section__title">Recent Activity</div>
      <div id="activity-container">
        <div class="empty">Loading activity…</div>
      </div>
    </section>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
