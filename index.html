<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Portfolio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="index">
    <div class="index__title">Index</div>
    <nav class="index__nav" id="index-nav"></nav>
  </aside>

  <main class="content">
    <header class="profile" id="profile-header">
      <div class="profile__bio" id="profile-bio">Loading...</div>
      <div class="profile__meta">
        <div class="profile__name" id="profile-name">Portfolio</div>
        <a class="profile__email" id="profile-email" href=""></a>
        <a class="profile__link" id="profile-link" href=""></a>
      </div>
    </header>

    <div class="posts" id="posts-container"></div>

    <footer class="footer">
      <span id="footer-timestamp"></span>
      <span class="footer__divider">—</span>
      <a href="login.html" id="footer-auth">Log In</a>
    </footer>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" id="lightbox-close">×</button>
    <button class="lightbox__prev" id="lightbox-prev">‹</button>
    <button class="lightbox__next" id="lightbox-next">›</button>
    <div class="lightbox__content">
      <img class="lightbox__image" id="lightbox-image" src="" alt="">
    </div>
    <div class="lightbox__thumbs" id="lightbox-thumbs"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
