<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:,">
</head>
<body class="portfolio">
  <aside class="index"></aside>

  <main class="content">
    <section class="profile"></section>
    <section class="posts"></section>
    <footer class="footer">
      <span id="footer-timestamp">--:--:--</span>
      <span class="footer__divider">•</span>
      <a href="/login.html" id="footer-auth">Log In</a>
    </footer>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" id="lightbox-close">&times;</button>
    <button class="lightbox__prev" id="lightbox-prev">‹</button>
    <button class="lightbox__next" id="lightbox-next">›</button>
    <div class="lightbox__content">
      <img class="lightbox__image" id="lightbox-image" src="" alt="">
    </div>
    <div class="lightbox__thumbs" id="lightbox-thumbs"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
