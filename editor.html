<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — Portfolio Web-App</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="nav">
    <div class="nav__left">
      <h1 class="nav__title">Studio</h1>
      <span class="nav__user" id="user-display">Loading…</span>
    </div>
    <div class="nav__right"></div>
  </header>

  <div class="editor-layout">
    <aside class="editor-sidebar">
      <div class="editor-sidebar__header">
        <span class="nav__user" id="user-display-sidebar"></span>
      </div>
      <nav class="editor-sidebar__nav">
        <a href="#" id="view-portfolio-btn">View Portfolio</a>
        <a href="profile.html" id="edit-profile-btn">Edit Profile</a>
        <a href="attendance.html" id="attendance-btn">Attendance</a>
        <a href="admin.html" id="admin-btn" style="display: none;">Admin</a>
      </nav>
      <div class="editor-sidebar__filters">
        <div class="editor-sidebar__label">Filter</div>
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="log">Logs</button>
        <button class="filter" data-filter="project">Projects</button>
      </div>
      <div class="editor-sidebar__footer">
        <a href="#" id="logout-btn">Log Out</a>
      </div>
    </aside>

    <main class="editor-content">
      <div class="editor-content__actions">
        <button class="btn btn--primary" id="add-log-btn">+ Log Entry</button>
        <button class="btn btn--primary" id="add-project-btn">+ Project</button>
      </div>

      <div class="grid" id="posts-grid">
        <div class="empty">
          <div style="font-size: 32px; margin-bottom: 12px;">📝</div>
          <div style="font-weight: 500; margin-bottom: 4px;">No entries yet</div>
          <div>Click "+ Log Entry" or "+ Project" to begin</div>
        </div>
      </div>
    </main>
  </div>

  <!-- Log Modal -->
  <div class="modal" id="log-modal">
    <div class="modal__box">
      <div class="modal__header">
        <h2 class="modal__title">Add Log Entry</h2>
        <button class="modal__close" data-close="log-modal">&times;</button>
      </div>
      <form id="log-form">
        <div class="modal__body">
          <div class="form-group">
            <label for="log-title">Title</label>
            <input type="text" id="log-title" name="title" required placeholder="What did you work on?">
          </div>
          <div class="form-group">
            <label for="log-date">Date</label>
            <input type="date" id="log-date" name="date" required>
          </div>
          <div class="form-group">
            <label>Images (up to 3)</label>
            <div class="upload-zone" id="log-image-upload">
              <input type="file" id="log-images" accept="image/*" multiple style="display: none;">
              Click to upload or drag images here<br>
              <small>Max 3 images, 5MB each</small>
            </div>
            <div class="upload-preview" id="log-image-preview"></div>
          </div>
          <div class="form-group">
            <label for="log-body">Notes</label>
            <textarea id="log-body" name="body" placeholder="What happened? What's next?&#10;&#10;Markdown supported."></textarea>
          </div>
        </div>
        <div class="modal__footer">
          <button type="button" class="btn" data-close="log-modal">Cancel</button>
          <button type="submit" class="btn btn--primary">Save Log</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Project Modal -->
  <div class="modal" id="project-modal">
    <div class="modal__box">
      <div class="modal__header">
        <h2 class="modal__title">Add Project</h2>
        <button class="modal__close" data-close="project-modal">&times;</button>
      </div>
      <form id="project-form">
        <div class="modal__body">
          <div class="form-group">
            <label for="project-title">Title</label>
            <input type="text" id="project-title" name="title" required placeholder="Project name">
          </div>
          <div class="form-group">
            <label>Hero Image</label>
            <div class="upload-zone" id="project-image-upload">
              <input type="file" id="project-image" accept="image/*" style="display: none;">
              Click to upload hero image<br>
              <small>Max 5MB</small>
            </div>
            <div class="upload-preview" id="project-image-preview"></div>
          </div>
          <div class="form-group">
            <label for="project-summary">Summary (1-2 sentences)</label>
            <textarea id="project-summary" name="summary" rows="3" placeholder="Brief overview"></textarea>
          </div>
          <div class="form-group">
            <label for="project-body">Description</label>
            <textarea id="project-body" name="body" placeholder="Full project description&#10;&#10;Markdown supported."></textarea>
          </div>
        </div>
        <div class="modal__footer">
          <button type="button" class="btn" data-close="project-modal">Cancel</button>
          <button type="submit" class="btn btn--primary">Save Project</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="editor.js?v=20260206"></script>
</body>
</html>
