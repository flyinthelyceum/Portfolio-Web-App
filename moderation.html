<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moderation — Portfolio Web-App</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="nav">
    <div class="nav__left">
      <h1 class="nav__title">Moderation</h1>
    </div>
    <div class="nav__right">
      <button class="btn" id="back-btn">Back to Admin</button>
    </div>
  </header>

  <main class="page">
    <section class="section">
      <div class="section__title">Posts</div>
      <div id="posts-container">
        <div class="empty">Loading posts…</div>
      </div>
    </section>

    <section class="section">
      <div class="section__title">Banned Students</div>
      <div id="banned-container">
        <div class="empty">Loading students…</div>
      </div>
    </section>
  </main>

  <!-- Confirm Modal -->
  <div class="modal" id="confirm-modal">
    <div class="modal__box" style="max-width: 480px;">
      <div class="modal__header">
        <h2 class="modal__title" id="confirm-title">Confirm Action</h2>
      </div>
      <div class="modal__body">
        <p id="confirm-text"></p>
      </div>
      <div class="modal__footer">
        <button class="btn" id="confirm-cancel">Cancel</button>
        <button class="btn btn--danger" id="confirm-ok">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module" src="moderation.js?v=20260206"></script>
</body>
</html>
